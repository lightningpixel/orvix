name: Release

# Pushing a tag like v0.1.0 publishes the matching GitHub release.
# Publishing to npm stays manual.
on:
  push:
    tags: ["v*"]

permissions:
  # Required to create the release.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes fall back to the commits since the previous tag,
          # which needs the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A tag that disagrees with package.json produces a release describing a
      # version that was never built. Catch it before anything is published.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump one of them and re-tag."
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit

      # A tag must never produce a release for code that does not pass.
      - run: npm test

      - name: Build the release notes
        id: notes
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            import { changelogSection } from './scripts/changelog-section.mjs';
            const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            const notes = changelogSection(readFileSync('CHANGELOG.md', 'utf8'), version);
            writeFileSync('RELEASE_NOTES.md', notes ?? '');
            console.log(notes ? 'using CHANGELOG section' : 'no CHANGELOG section, falling back');
          "
          if [ -s RELEASE_NOTES.md ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      # Attaching the tarball lets anyone install the exact artefact that was
      # tested, without waiting for npm.
      - name: Pack the tarball
        run: npm pack --pack-destination dist-pack

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.generate }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              dist-pack/*.tgz
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md \
              dist-pack/*.tgz
          fi
