name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every broken combination, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Copies the grammars, then bundles the CLI.
      - run: npm run build

      - run: npx tsc --noEmit

      - run: npm test

  benchmark:
    name: synthetic benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Guards the trade the hooks make. It fails when a compression stops
      # preserving what a task needed, not merely when the saving shrinks —
      # tokens saved is worthless on its own, since returning nothing would
      # score perfectly.
      - run: node benchmarks/run.mjs --mode synthetic

  package:
    name: packaged install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Installing the real tarball is the only way to catch a file missing
      # from `files`, a postinstall that breaks the install, or grammars that
      # cannot be located from an installed layout.
      - name: Pack and install
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install /tmp/orvix-*.tgz

      - name: Smoke test the installed CLI
        env:
          HOME: /tmp/consumer/home
        run: |
          cd /tmp/consumer
          mkdir -p home demo/src
          printf 'export function validate(email: string) {\n  return email;\n}\n' > demo/src/auth.ts
          printf 'import { validate } from "./auth";\nexport function login(e: string) {\n  return validate(e);\n}\n' > demo/src/login.ts

          ./node_modules/.bin/orvix --version
          ./node_modules/.bin/orvix init demo --agent claude
          test -f demo/CLAUDE.md
          grep -q '.orvix/' demo/.gitignore

          # The hooks are the integration. A missing entry in `files` would
          # leave a project configured to run scripts that were never shipped.
          test -f demo/.claude/hooks/orvix-dirty.mjs
          test -f demo/.claude/hooks/orvix-compress.mjs
          test -f demo/.claude/hooks/orvix-reconcile.mjs
          grep -q 'orvix-compress' demo/.claude/settings.json

          # The query path is what the hooks call, so it has to work from an
          # installed layout too.
          ./node_modules/.bin/orvix-query find validate --path demo | tee q.txt
          grep -q 'validate' q.txt

          # An edit marked dirty must be picked up by the next query alone.
          printf 'export function validate(email: string) {\n  return email.trim();\n}\nexport function extra() {}\n' > demo/src/auth.ts
          printf '%s\n' 'src/auth.ts' > demo/.orvix/dirty
          ./node_modules/.bin/orvix-query find extra --path demo | tee inc.txt
          grep -q 'extra' inc.txt

          ./node_modules/.bin/orvix map demo | tee map.txt
          grep -q 'function validate' map.txt

          ./node_modules/.bin/orvix who-calls validate -p demo | tee callers.txt
          grep -q 'login' callers.txt
